name: Celestial publisher-funded indexing canaries
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Explicit one-run authorization: PUBLISHER_FUNDED_CELESTIAL_THREE_ONCE_MAX_0_16_USDC'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  index:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-x402-canary
    env:
      BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
      CELESTIAL_CANARY_OUTPUT_PATH: ${{ github.workspace }}/celestial-indexing-canary.json
      CELESTIAL_CANARY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Purchase three synthetic calculations once, sequentially
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-celestial-indexing-canaries.ts
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: celestial-indexing-canary-${{ github.run_id }}
          path: ${{ env.CELESTIAL_CANARY_OUTPUT_PATH }}
          if-no-files-found: error
          retention-days: 90
