name: Approved 132 additions to 958 modular products
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_132_ONCE_MAX_6996054'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  index:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISHER_FUNDED_132_ONCE_MAX_6996054'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-x402-canary
    env:
      MODULAR132_CONFIRMATION: ${{ inputs.confirmation }}
      MODULAR132_OUTPUT_PATH: ${{ github.workspace }}/modular132-indexing-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Check all quotes before signer access
        run: node --experimental-strip-types scripts/run-modular132-indexing.ts --preflight
      - name: At most one first purchase per new endpoint, capped at 6.996054 USDC
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-modular132-indexing.ts --pay
      - name: Preserve redacted evidence and encrypted recovery packets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modular132-indexing-${{ github.run_id }}
          path: |
            ${{ env.MODULAR132_OUTPUT_PATH }}
            ${{ env.MODULAR132_OUTPUT_PATH }}.recovery-encrypted.json
          retention-days: 90
          if-no-files-found: warn
