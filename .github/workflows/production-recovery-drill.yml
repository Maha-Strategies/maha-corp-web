name: Production recovery drill

on:
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: production-recovery-drill
  cancel-in-progress: true

jobs:
  validate-last-known-good:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production-monitoring
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_RELEASE_HEALTH_TOKEN: ${{ secrets.PRODUCTION_RELEASE_HEALTH_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RELEASE_MANIFEST_PATH: ${{ github.workspace }}/last-known-good/production-last-known-good.json
      RELEASE_HEALTH_OUTPUT: ${{ github.workspace }}/recovery-drill-health.json
      VERCEL_DEPLOYMENT_JSON_PATH: ${{ github.workspace }}/recovery-deployment.json
      ALLOW_VERCEL_DEPLOYMENT_URL: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Find latest successful release-health run
        id: health-run
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-release-health.yml/runs?status=success&branch=main&per_page=1" > "$RUNNER_TEMP/health-runs.json"
          node --input-type=module -e "import fs from 'node:fs'; const id=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health-runs.json')).workflow_runs?.[0]?.id; if(!id) throw new Error('No successful release-health run exists.'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_id='+id+'\\n')"
      - uses: actions/download-artifact@v5
        with:
          name: production-last-known-good
          path: ${{ github.workspace }}/last-known-good
          github-token: ${{ github.token }}
          run-id: ${{ steps.health-run.outputs.run_id }}
      - name: Validate recovery manifest
        id: recovery
        run: node --experimental-strip-types scripts/resolve-release-manifest.ts
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.4.0
      - name: Confirm recovery deployment remains READY
        run: vercel inspect "${{ steps.recovery.outputs.deployment_id }}" --json --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID" > "$VERCEL_DEPLOYMENT_JSON_PATH"
      - name: Exercise recovery deployment directly
        env:
          PRODUCTION_BASE_URL: ${{ steps.recovery.outputs.deployment_url }}
        run: node --experimental-strip-types scripts/verify-production-release.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-recovery-drill-${{ github.run_id }}
          path: ${{ env.RELEASE_HEALTH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 30
