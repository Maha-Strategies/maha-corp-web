name: Production x402 settlement verification

# Read-only. Answers the two promotion criteria that cannot be observed from
# outside the database: did the paid call record telemetry, and does anything
# in the x402 schema retain caller request content.
#
# Separate from the settlement workflow because it must be runnable again
# without spending anything. Folding a verification that operators will want to
# repeat into a workflow that moves money means the only way to re-check is to
# pay again.
#
# Issues SELECTs only. No DDL, no writes, no wallet key in scope.

on:
  workflow_dispatch:
    inputs:
      offer_id:
        description: Offer to verify telemetry for
        required: true
        default: deep-context-evaluation
        type: string

permissions:
  contents: read

concurrency:
  group: production-x402-settlement-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      OFFER_ID: ${{ inputs.offer_id }}
    steps:
      - uses: actions/checkout@v7

      # The mirror image of the Preview workflow's guard. That one refuses to
      # touch Production; this one refuses to report on anything else, because
      # a green verification against staging would be worse than no
      # verification at all.
      - name: Require the Production target
        run: |
          set -euo pipefail
          production='uhwuullakihgszxhiygz'
          if [ "${SUPABASE_PROJECT_REF:-}" != "$production" ]; then
            echo '::error::SUPABASE_PROJECT_REF is not the Production ref. This workflow only reports on Production.'
            exit 1
          fi
          echo "target database fingerprint: sha256:$(printf '%s' "$SUPABASE_PROJECT_REF" | sha256sum | cut -d' ' -f1)"

      - name: Resolve the project's pooler connection
        run: |
          set -euo pipefail
          poolers=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/database/pooler")
          pooler=$(jq -cer '
            [ .[] | select(.database_type == "PRIMARY") ]
            | .[0]
            | select(
                (.db_host | type == "string" and length > 0)
                and (.db_port | type == "number")
                and (.db_user | type == "string" and length > 0)
                and (.db_name | type == "string" and length > 0)
              )
          ' <<<"$poolers")
          echo "SUPABASE_DB_HOST=$(jq -r '.db_host' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PORT=$(jq -r '.db_port' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_USER=$(jq -r '.db_user' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_NAME=$(jq -r '.db_name' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "Resolved the Production pooler connection from authenticated project metadata."

      - name: Resolve the compression offer contract
        run: |
          set -euo pipefail
          case "$OFFER_ID" in
            context-compression)
              resource='https://www.mahastrategies.com/api/v1/compress'
              amount='1000'
              ;;
            deep-context-evaluation)
              resource='https://www.mahastrategies.com/api/v1/compress/evaluate'
              amount='10000'
              ;;
            *)
              echo "::error::This zero-retention verifier does not support offer '${OFFER_ID}'."
              exit 1
              ;;
          esac
          echo "EXPECTED_RESOURCE=$resource" >> "$GITHUB_ENV"
          echo "EXPECTED_AMOUNT=$amount" >> "$GITHUB_ENV"

      - name: Telemetry recorded for the offer
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          dsn="host=${SUPABASE_DB_HOST} port=${SUPABASE_DB_PORT} user=${SUPABASE_DB_USER} dbname=${SUPABASE_DB_NAME} sslmode=require"
          echo '--- usage rows for the offer, last 2 days ---'
          psql "$dsn" -v ON_ERROR_STOP=1 -P pager=off -c "
            select usage_day, event_kind, status_class, discovery_source, event_count,
                   required_evidence_total, retained_evidence_total, last_observed_at
              from public.x402_offer_usage_daily
             where offer_id = '${OFFER_ID}'
               and usage_day >= (current_date - 1)
             order by usage_day desc, event_kind, status_class;
          "
          invocations=$(psql "$dsn" -At -v ON_ERROR_STOP=1 -c "
            select coalesce(sum(event_count), 0)
              from public.x402_offer_usage_daily
             where offer_id = '${OFFER_ID}'
               and event_kind = 'invocation'
               and status_class = '2xx'
               and usage_day >= (current_date - 1);
          ")
          echo "successful invocations recorded: ${invocations}"
          if [ "${invocations:-0}" -lt 1 ]; then
            echo '::error::No successful invocation was recorded for this offer. The paid call did not increment telemetry.'
            exit 1
          fi

      - name: Settlement recorded and corroborated
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          dsn="host=${SUPABASE_DB_HOST} port=${SUPABASE_DB_PORT} user=${SUPABASE_DB_USER} dbname=${SUPABASE_DB_NAME} sslmode=require"
          psql "$dsn" -v ON_ERROR_STOP=1 -P pager=off -c "
            select p.resource, p.payer, p.amount_paid, s.transaction_id,
                   s.chain_status, s.chain_amount, s.settled_at
              from public.x402_settlements s
              join public.x402_payments p on p.payment_id = s.payment_id
             where p.resource = '${EXPECTED_RESOURCE}'
               and s.settled_at >= now() - interval '2 days'
             order by s.settled_at desc
             limit 10;
          "
          confirmed=$(psql "$dsn" -At -v ON_ERROR_STOP=1 -c "
            select count(*)
              from public.x402_settlements s
              join public.x402_payments p on p.payment_id = s.payment_id
             where p.resource = '${EXPECTED_RESOURCE}'
               and p.amount_paid = ${EXPECTED_AMOUNT}
               and s.chain_status = 'confirmed'
               and s.chain_amount = ${EXPECTED_AMOUNT}
               and s.settled_at >= now() - interval '2 days';
          ")
          echo "exact confirmed settlements recorded: ${confirmed}"
          if [ "${confirmed:-0}" -lt 1 ]; then
            echo '::error::No recent settlement matches the offer resource, amount, and independently confirmed chain amount.'
            exit 1
          fi

      # Structural rather than sampled. Scope this claim to the tables the two
      # compression offers write. x402_mps_audits is deliberately excluded: its
      # separate public contract retains short claim excerpts by design.
      - name: Compression payment and telemetry tables cannot retain request content
        run: |
          set -euo pipefail
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          dsn="host=${SUPABASE_DB_HOST} port=${SUPABASE_DB_PORT} user=${SUPABASE_DB_USER} dbname=${SUPABASE_DB_NAME} sslmode=require"
          echo '--- every text/json column in the x402 schema ---'
          psql "$dsn" -v ON_ERROR_STOP=1 -P pager=off -c "
            select table_name, column_name, data_type
              from information_schema.columns
             where table_schema = 'public'
               and table_name in ('x402_offer_usage_daily', 'x402_payments', 'x402_settlements')
               and data_type in ('text', 'character varying', 'json', 'jsonb')
             order by table_name, column_name;
          "
          # Named after the request fields that carry caller content. Any column
          # matching these is a place document text could land.
          offenders=$(psql "$dsn" -At -v ON_ERROR_STOP=1 -c "
            select table_name || '.' || column_name
              from information_schema.columns
             where table_schema = 'public'
               and table_name in ('x402_offer_usage_daily', 'x402_payments', 'x402_settlements')
               and (column_name ~ '(document|passage|excerpt|source_text|body|content|prompt|evidence_text|context)')
             order by 1;
          ")
          if [ -n "$offenders" ]; then
            echo "::error::Columns capable of retaining caller content exist: ${offenders}"
            exit 1
          fi
          echo 'No compression payment or telemetry column is shaped to hold caller request content.'
