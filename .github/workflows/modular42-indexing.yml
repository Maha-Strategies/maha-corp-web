name: Final 42 additions to 1000 modular products
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_42_ONCE_MAX_2592940'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  index:
    if: github.run_attempt == 1 && github.run_number == 1 && github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISHER_FUNDED_42_ONCE_MAX_2592940'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-x402-canary
    env:
      MODULAR42_CONFIRMATION: ${{ inputs.confirmation }}
      MODULAR42_OUTPUT_PATH: ${{ github.workspace }}/modular42-indexing-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Unpaid quotes and complete catalogue check before signer access
        run: node --experimental-strip-types scripts/run-modular42-indexing.ts --preflight
      - name: One publisher-funded purchase per new endpoint, at most 2.592940 USDC
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-modular42-indexing.ts --pay
      - name: Preserve redacted evidence and encrypted recovery packets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modular42-indexing-${{ github.run_id }}
          path: |
            ${{ env.MODULAR42_OUTPUT_PATH }}
            ${{ env.MODULAR42_OUTPUT_PATH }}.recovery-encrypted.json
          retention-days: 90
          if-no-files-found: warn
