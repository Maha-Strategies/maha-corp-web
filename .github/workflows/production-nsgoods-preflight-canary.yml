name: Production NSGoods preflight canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PAY NSGOODS PREFLIGHT 0.015 USDC'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-nsgoods-preflight-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-x402-canary
      url: https://x402.nsgoods.org/preflight
    env:
      BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
    steps:
      - name: Refuse any broader authorization
        run: test '${{ inputs.confirmation }}' = 'PAY NSGOODS PREFLIGHT 0.015 USDC'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r fixtures/x402-composite-preflight-v3/requirements.txt
      - name: Pin the live signer manifest before payment
        env:
          NSGOODS_PREFLIGHT_MANIFEST_PATH: ${{ runner.temp }}/nsgoods-preflight/proof-index.json
        run: |
          mkdir -p "$(dirname "$NSGOODS_PREFLIGHT_MANIFEST_PATH")"
          curl --fail --silent --show-error --location https://x402.nsgoods.org/proof/index.json --output "$NSGOODS_PREFLIGHT_MANIFEST_PATH"
      - name: Validate the protected buyer and balance without payment
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-nsgoods-preflight-live-canary.ts --validate-config
      - name: Make exactly one authorized 0.015 USDC call
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
          NSGOODS_PREFLIGHT_RESPONSE_PATH: ${{ runner.temp }}/nsgoods-preflight/live-response.json
          NSGOODS_PREFLIGHT_PAYMENT_PATH: ${{ runner.temp }}/nsgoods-preflight/payment-evidence.json
        run: node --experimental-strip-types scripts/run-nsgoods-preflight-live-canary.ts
      - name: Independently verify the response and settlement evidence
        env:
          NSGOODS_PREFLIGHT_RESPONSE_PATH: ${{ runner.temp }}/nsgoods-preflight/live-response.json
          NSGOODS_PREFLIGHT_PAYMENT_PATH: ${{ runner.temp }}/nsgoods-preflight/payment-evidence.json
          NSGOODS_PREFLIGHT_MANIFEST_PATH: ${{ runner.temp }}/nsgoods-preflight/proof-index.json
          NSGOODS_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/nsgoods-preflight/validation-report.json
        run: >-
          python scripts/verify-x402-composite-preflight-live.py
          --response "$NSGOODS_PREFLIGHT_RESPONSE_PATH"
          --payment "$NSGOODS_PREFLIGHT_PAYMENT_PATH"
          --manifest "$NSGOODS_PREFLIGHT_MANIFEST_PATH"
          --report "$NSGOODS_PREFLIGHT_REPORT_PATH"
      - name: Upload bounded canary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-nsgoods-preflight-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/nsgoods-preflight
          if-no-files-found: warn
          retention-days: 90
