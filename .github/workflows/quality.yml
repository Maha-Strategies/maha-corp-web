name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time validation only. CI must never receive Production Redis credentials.
      UPSTASH_REDIS_REST_URL: https://ci-build.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-build-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run expand-graph
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: rm -rf .next
      - run: npm run build
