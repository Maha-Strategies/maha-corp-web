name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time validation only. CI must never receive Production Redis credentials.
      UPSTASH_REDIS_REST_URL: https://ci-build.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-build-placeholder
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the migration check can resolve the merge base with
          # the target branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema integrity before anything expensive: append-only migrations,
      # unique ordered timestamps, and justified destructive DDL.
      - name: Verify migration integrity
        run: node --experimental-strip-types scripts/check-migrations.ts
      # Advisories in dependencies that reach customers. Dev-only advisories are
      # tracked by Dependabot but do not block a release.
      # Retries a registry outage, never an advisory. Three runs in one day were
      # blocked by 503s from the audit endpoint with no advisory involved; a
      # gate that cannot run still fails, and says so, rather than passing.
      - name: Audit production dependencies
        run: node --experimental-strip-types scripts/audit-production-dependencies.ts
      - run: npm run expand-graph
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The x402 payment payload the client signs and the id the server claims
      # against must agree, or replay protection silently guards nothing. The
      # dry run proves that with a throwaway key and no network, so it runs on
      # every commit rather than only when someone remembers the testnet.
      - name: Verify x402 payload signing and identity
        run: npm run verify:x402-sepolia -- --dry-run
      - run: rm -rf .next
      - run: npm run build
      - name: Verify Navigator browser bundle boundary
        run: npm run verify:navigator-client-bundle

  # The Modal GPU worker ships outside the Vercel build, so nothing else in CI
  # would notice if it stopped importing. Its own test spawns a real GPU job on
  # Modal and bills for it, so it cannot run here; this catches the breakage
  # class that does not need an account: syntax errors and undefined names.
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.1
      - name: Check worker for syntax errors and undefined names
        run: ruff check --isolated --select E9,F82 workers/
      - name: Byte-compile the worker
        run: python -m compileall -q workers

      # The Python client is the base for the LangChain and CrewAI adapters, so
      # it is published to other people's agent environments. It is
      # dependency-free and its tests use stdlib unittest, so this needs no
      # install step and no test framework.
      - name: Check the Python client
        run: ruff check --isolated --select E9,F82 clients/python/
      - name: Test the Python client
        working-directory: clients/python
        run: python -m unittest discover -s tests -v
      - name: Check the computational provenance witness
        run: ruff check --isolated --select E9,F82 packages/maha-witness/
      - name: Test the computational provenance witness
        working-directory: packages/maha-witness
        run: PYTHONPATH=src python -m unittest discover -s tests -v
