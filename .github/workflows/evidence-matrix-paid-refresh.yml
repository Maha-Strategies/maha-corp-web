name: Evidence Matrix publisher-funded refresh
run-name: Index eight buyer and science workflows (1.432664 USDC cap)

# Manual only. This branch cannot dispatch any other payment job.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_WORKFLOW_BUYER_SCIENCE_EIGHT_ONCE_MAX_1432664'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false

jobs:
  workflow-buyer-science-eight:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/codex/workflow-buyer-science-eight-20261114' && inputs.confirmation == 'PUBLISHER_FUNDED_WORKFLOW_BUYER_SCIENCE_EIGHT_ONCE_MAX_1432664'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    environment: production-x402-canary
    env:
      WORKFLOW_BUYER_SCIENCE_EIGHT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test test/workflow-buyer-science-eight-indexing.test.mjs
      - name: Check the eight exact live inputs, quotes and public listings
        run: node --experimental-strip-types scripts/run-workflow-buyer-science-eight.mjs --plan
      - name: Authorize each route once, waiting for its exact listing before the next
        env:
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
          WORKFLOW_BUYER_SCIENCE_EIGHT_EVIDENCE: ${{ runner.temp }}/workflow-buyer-science-eight-evidence.json
        run: node --experimental-strip-types scripts/run-workflow-buyer-science-eight.mjs --pay
      - name: Preserve redacted evidence and encrypted recovery capsules
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-buyer-science-eight-bazaar-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workflow-buyer-science-eight-evidence.json
            ${{ runner.temp }}/workflow-buyer-science-eight-evidence.json.encrypted.json
          if-no-files-found: warn
          retention-days: 90
