name: Evidence Matrix publisher-funded refresh
run-name: Index eight approved buyer-priority workflows (1.267436 USDC cap)

# Manual one-time operation only. No schedule, no deployment, no Vercel build.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_WORKFLOW_EIGHT_ONCE_MAX_1267436'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-x402-canary
    env:
      BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
      MATRIX_REFRESH_CONFIRMATION: ${{ inputs.confirmation }}
      MATRIX_REFRESH_OUTPUT_PATH: ${{ github.workspace }}/matrix-refresh-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test fixed payment boundaries
        run: node --experimental-strip-types --test test/evidence-matrix-refresh.test.ts
      - name: Read-only live preflight
        run: node --experimental-strip-types scripts/run-evidence-matrix-refresh.ts
      - name: Publisher-funded purchase once
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-evidence-matrix-refresh.ts --pay
      - name: Preserve sanitized settlement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-matrix-refresh-${{ github.run_id }}
          path: ${{ env.MATRIX_REFRESH_OUTPUT_PATH }}
          if-no-files-found: warn
          retention-days: 90

  workflow-eight:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/codex/workflow-eight-indexing-20261114' && inputs.confirmation == 'PUBLISHER_FUNDED_WORKFLOW_EIGHT_ONCE_MAX_1267436'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    environment: production-x402-canary
    env:
      WORKFLOW_EIGHT_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm install --global npm@11.17.0 --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types --test test/workflow-eight-indexing.test.mjs
      - name: Check eight exact live inputs, unsigned quotes and Coinbase validation
        run: node --experimental-strip-types scripts/run-workflow-eight-indexing.mjs --plan
      - name: Authorize each route once, waiting for its exact listing before the next
        env:
          BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
          WORKFLOW_EIGHT_EVIDENCE: ${{ runner.temp }}/workflow-eight-evidence.json
        run: node --experimental-strip-types scripts/run-workflow-eight-indexing.mjs --pay
      - name: Preserve redacted evidence and encrypted recovery capsules
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: workflow-eight-bazaar-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/workflow-eight-evidence.json
            ${{ runner.temp }}/workflow-eight-evidence.json.encrypted.json
          if-no-files-found: warn
          retention-days: 90
