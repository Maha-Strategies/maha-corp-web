name: Evidence Matrix publisher-funded refresh

# Manual one-time operation only. No schedule, no deployment, no Vercel build.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_MATRIX_ONCE_MAX_0_05_USDC'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false

jobs:
  refresh:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-x402-canary
    env:
      BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
      MATRIX_REFRESH_CONFIRMATION: ${{ inputs.confirmation }}
      MATRIX_REFRESH_OUTPUT_PATH: ${{ github.workspace }}/matrix-refresh-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test fixed payment boundaries
        run: node --experimental-strip-types --test test/evidence-matrix-refresh.test.ts
      - name: Read-only live preflight
        run: node --experimental-strip-types scripts/run-evidence-matrix-refresh.ts
      - name: Publisher-funded purchase once
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-evidence-matrix-refresh.ts --pay
      - name: Preserve sanitized settlement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-matrix-refresh-${{ github.run_id }}
          path: ${{ env.MATRIX_REFRESH_OUTPUT_PATH }}
          if-no-files-found: warn
          retention-days: 90
