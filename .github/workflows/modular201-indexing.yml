name: Controlled final modular201 purchase after expired-unused proof
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'RETRY_ONCE_AFTER_UNUSED_EXPIRED_MAX_38339'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  investigate:
    if: github.run_attempt == 1 && github.run_number == 3 && github.ref == 'refs/heads/codex/modular201-recovery-20261015' && inputs.confirmation == 'RETRY_ONCE_AFTER_UNUSED_EXPIRED_MAX_38339'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-x402-canary
    env:
      MODULAR201_RECOVERY_CONFIRMATION: 'INVESTIGATE_201_FINAL_RETAINED_ONLY_NO_PAYMENT'
      MODULAR201_CONTROLLED_RETRY_CONFIRMATION: ${{ inputs.confirmation }}
      MODULAR201_ORIGINAL_DIRECTORY: ${{ github.workspace }}/.modular201-original
      MODULAR201_RECOVERY_OUTPUT: ${{ github.workspace }}/modular201-investigation.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Test one-time reserve and retained-only recovery safeguards
        run: node --experimental-strip-types --test test/modular201-controlled-retry.test.ts test/modular201-investigation.test.ts test/modular201-indexing.test.ts
      - name: Download exact original encrypted artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '11967279124'
          run-id: '38722500745'
          github-token: ${{ github.token }}
          path: ${{ env.MODULAR201_ORIGINAL_DIRECTORY }}
      - name: Recheck original, then one fresh purchase within reserved cap
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/retry-modular201-final.ts --investigate
      - name: Preserve redacted investigation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modular201-controlled-retry-${{ github.run_id }}
          path: |
            ${{ env.MODULAR201_RECOVERY_OUTPUT }}
            ${{ env.MODULAR201_RECOVERY_OUTPUT }}.controlled-retry.json
            ${{ env.MODULAR201_RECOVERY_OUTPUT }}.controlled-retry.json.recovery-encrypted.json
          retention-days: 90
          if-no-files-found: warn
