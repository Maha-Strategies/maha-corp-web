name: Probe workspace readiness

# Read-only. Reads the release workspace and reports why candidates are
# unready. Creates nothing, ingests nothing, releases nothing.

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: Optional comma-separated record URNs to report individually
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: probe-workspace-readiness
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production-database
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe, read-only
        env:
          EPISTEMIC_RELEASE_AUTHORITY_TOKEN: ${{ secrets.EPISTEMIC_RELEASE_AUTHORITY_TOKEN }}
          PROBE_COHORT: ${{ inputs.cohort }}
        run: node --experimental-strip-types scripts/probe-workspace-readiness.ts
