name: Approved modular204 retained recovery and continuation
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'RECOVER_FIRST_THEN_203_MAX_TOTAL_2534496'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  index:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/codex/modular204-recovery-20261015' && inputs.confirmation == 'RECOVER_FIRST_THEN_203_MAX_TOTAL_2534496'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-x402-canary
    env:
      MODULAR204_RECOVERY_CONFIRMATION: ${{ inputs.confirmation }}
      MODULAR204_ORIGINAL_RUN: '38697859110'
      MODULAR204_ORIGINAL_DIRECTORY: ${{ github.workspace }}/.modular204-original
      MODULAR204_OUTPUT_PATH: ${{ github.workspace }}/modular204-continuation-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Retrieve the exact original encrypted recovery artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: '11954678693'
          run-id: '38697859110'
          github-token: ${{ github.token }}
          path: ${{ env.MODULAR204_ORIGINAL_DIRECTORY }}
      - name: Check all quotes before signer access
        run: node --experimental-strip-types scripts/run-modular204-continuation.ts --preflight
      - name: Recover original without repaying, then at most 203 first purchases within original cap
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-modular204-continuation.ts --continue
      - name: Preserve redacted operator evidence and encrypted recovery packets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modular204-continuation-${{ github.run_id }}
          path: |
            ${{ env.MODULAR204_OUTPUT_PATH }}
            ${{ env.MODULAR204_OUTPUT_PATH }}.recovery-encrypted.json
          retention-days: 90
          if-no-files-found: warn
