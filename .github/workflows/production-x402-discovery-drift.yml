name: Production x402 discovery drift
on:
  schedule:
    - cron: '43 5,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/x402/**'
      - 'lib/api-v1/**'
      - 'content/api-v1/**'
      - 'content/discovery/**'
      - 'app/api/v1/**'
permissions:
  contents: read
  issues: write
concurrency:
  group: production-x402-discovery-drift
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: inventory
        name: Require complete legacy and 1000-product modular manifests
        run: node --experimental-strip-types scripts/x402-discovery-inventory.ts
  drift:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      OFFERS_JSON: ${{ toJSON(matrix.offers) }}
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use the lockfile-compatible npm resolver
        run: npm install --global npm@11.17.0
      - name: Install locked monitor dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Unpaid checks with one shared complete Bazaar snapshot per batch
        id: check
        run: node --experimental-strip-types scripts/x402-discovery-monitor.ts batch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: x402-discovery-batch-${{ matrix.batch }}
          path: discovery-reports
          retention-days: 30
      - name: Record bounded aggregate incident, not one email per route
        if: ${{ always() && (steps.check.outputs.classification != 'clean') }}
        env:
          SUMMARY: ${{ steps.check.outputs.summary || 'Runner failed; coverage incomplete' }}
          EVIDENCE_FINGERPRINT: ${{ steps.check.outputs.evidence_fingerprint }}
        run: |
          TITLE="x402 discovery batch ${BATCH}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY="Unpaid catalogue check: $SUMMARY. Inspect the full report artifact. Absence is distinct from payability and delivery; no paid delivery was tested. Do not refresh by payment without approval. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ "$EVIDENCE_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]; then
            MARKER="<!-- maha-discovery-evidence:$EVIDENCE_FINGERPRINT -->"
            BODY="$BODY $MARKER"
            if [ -n "$EXISTING" ]; then
              LAST=$(gh issue view "$EXISTING" --json body,comments --jq '.comments[-1].body // .body')
              if printf '%s' "$LAST" | grep -Fq -- "$MARKER"; then
                echo "Unchanged findings; keeping the incident open without another notification."
                exit 0
              fi
            fi
          fi
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
      - name: Close only this batch incident after a complete clean check
        if: ${{ steps.check.outputs.classification == 'clean' }}
        run: |
          TITLE="x402 discovery batch ${BATCH}"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then gh issue close "$EXISTING" --comment "Complete unpaid batch check is clean. See the report artifact; no paid delivery or customer demand is asserted."; fi
