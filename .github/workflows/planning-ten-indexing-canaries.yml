name: Ten planning products publisher-funded indexing
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'PUBLISHER_FUNDED_PLANNING_TEN_ONCE_MAX_0_98_USDC'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-x402-bazaar-canary
  cancel-in-progress: false
jobs:
  index:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-x402-canary
    env:
      BASE_RPC_URL: ${{ vars.BASE_RPC_URL }}
      PLANNING_CANARY_OUTPUT_PATH: ${{ github.workspace }}/planning-ten-indexing-evidence.json
      PLANNING_CANARY_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Use the lockfile-compatible npm resolver
        run: npm install --global npm@11.17.0
      - run: npm ci
      - name: Test exact approved cohort and payment boundaries
        run: node --test --experimental-strip-types test/planning-ten-indexing.test.ts test/x402-micro-planning.test.ts test/x402-micro-price-policy.test.ts
      - name: Read-only preflight of all ten production challenges
        run: node --experimental-strip-types scripts/run-planning-ten-indexing-canaries.ts
      - name: Purchase one synthetic result per endpoint; no automatic repayments
        env:
          X402_BUYER_PRIVATE_KEY: ${{ secrets.X402_BUYER_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/run-planning-ten-indexing-canaries.ts --pay
      - name: Preserve sanitized evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planning-ten-indexing-${{ github.run_id }}
          path: ${{ env.PLANNING_CANARY_OUTPUT_PATH }}
          if-no-files-found: warn
          retention-days: 90
