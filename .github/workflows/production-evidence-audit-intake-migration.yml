name: Production Evidence Audit intake migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect Production or apply exactly one reviewed migration
        required: true
        default: verify
        type: choice
        options: [verify, apply]
      confirmation:
        description: For apply, type APPLY EVIDENCE AUDIT INTAKE CONSTRAINTS exactly
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EVIDENCE: ${{ github.workspace }}/evidence-audit-intake-migration-evidence
      MIGRATION: 20260831164500_allow_evidence_audit_inbound_offer.sql
      MIGRATION_SHA256: 7f72b890d160d7d041e1b3e7b6d8270d9b27f2f345ddc98e2f4292f7a53aabe1
    steps:
      - name: Enforce the Production target and exact confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          production='uhwuullakihgszxhiygz'
          test "${SUPABASE_PROJECT_REF:-}" = "$production"
          test "$OPERATION" = 'verify' -o "$OPERATION" = 'apply'
          if [ "$OPERATION" = 'apply' ]; then
            test "$CONFIRMATION" = 'APPLY EVIDENCE AUDIT INTAKE CONSTRAINTS'
          fi
          echo "targetFingerprint=sha256:$(printf '%s' "$SUPABASE_PROJECT_REF" | sha256sum | cut -d' ' -f1)"

      - uses: actions/checkout@v7

      - name: Verify immutable migration bytes
        run: |
          set -euo pipefail
          path="supabase/migrations/$MIGRATION"
          test -f "$path"
          test "$(sha256sum "$path" | cut -d' ' -f1)" = "$MIGRATION_SHA256"

      - name: Resolve the Production pooler connection
        run: |
          set -euo pipefail
          poolers=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/database/pooler")
          pooler=$(jq -cer '
            [ .[] | select(.database_type == "PRIMARY") ]
            | .[0]
            | select(
                (.db_host | type == "string" and length > 0)
                and (.db_port | type == "number")
                and (.db_user | type == "string" and length > 0)
                and (.db_name | type == "string" and length > 0)
              )
          ' <<<"$poolers")
          echo "SUPABASE_DB_HOST=$(jq -r '.db_host' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PORT=$(jq -r '.db_port' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_USER=$(jq -r '.db_user' <<<"$pooler")" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_NAME=$(jq -r '.db_name' <<<"$pooler")" >> "$GITHUB_ENV"

      - name: Apply exactly the reviewed migration
        if: ${{ inputs.operation == 'apply' }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          dsn="host=${SUPABASE_DB_HOST} port=${SUPABASE_DB_PORT} user=${SUPABASE_DB_USER} dbname=${SUPABASE_DB_NAME} sslmode=require"
          version="${MIGRATION%%_*}"
          count="$(psql "$dsn" -At -v ON_ERROR_STOP=1 -c "select count(*) from supabase_migrations.schema_migrations where version = '${version}';")"
          if [ "$count" = '0' ]; then
            psql "$dsn" -v ON_ERROR_STOP=1 --single-transaction -f "supabase/migrations/$MIGRATION" > "$EVIDENCE/applied.txt" 2>&1
            psql "$dsn" -v ON_ERROR_STOP=1 -c "insert into supabase_migrations.schema_migrations (version) values ('${version}') on conflict do nothing;" >> "$EVIDENCE/applied.txt" 2>&1
          elif [ "$count" = '1' ]; then
            echo 'Migration history already contains the exact version; entering verification-only replay.' > "$EVIDENCE/applied.txt"
          else
            echo '::error::Migration history returned an impossible count.'
            exit 1
          fi

      - name: Inspect and verify the exact allowlists
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          export PGPASSWORD="$SUPABASE_DB_PASSWORD"
          dsn="host=${SUPABASE_DB_HOST} port=${SUPABASE_DB_PORT} user=${SUPABASE_DB_USER} dbname=${SUPABASE_DB_NAME} sslmode=require"
          psql "$dsn" -At -v ON_ERROR_STOP=1 -c "
            select 'history=' || (exists (
              select 1 from supabase_migrations.schema_migrations where version = '20260831164500'
            ))::text
            union all select 'inbound-offer=' || (
              pg_get_constraintdef(oid) like '%mps-evidence-audit%'
            )::text from pg_constraint where conname = 'inbound_submissions_offer_id_check'
            union all select 'revenue-offer=' || (
              pg_get_constraintdef(oid) like '%mps-evidence-audit%'
            )::text from pg_constraint where conname = 'revenue_opportunities_offer_id_check';
          " | tee "$EVIDENCE/verify.txt"
          test "$(wc -l < "$EVIDENCE/verify.txt")" -eq 3
          if [ "$OPERATION" = 'apply' ] && grep -q '=false' "$EVIDENCE/verify.txt"; then
            echo '::error::The Evidence Audit intake constraints did not converge.'
            exit 1
          fi

      - name: Record sanitized evidence
        if: always()
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          {
            echo "operation: $OPERATION"
            echo "migration: $MIGRATION"
            echo "migrationSha256: $MIGRATION_SHA256"
            echo "commit: $GITHUB_SHA"
            echo "targetFingerprint: sha256:$(printf '%s' "$SUPABASE_PROJECT_REF" | sha256sum | cut -d' ' -f1)"
          } > "$EVIDENCE/request.txt"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-audit-intake-migration-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 90
