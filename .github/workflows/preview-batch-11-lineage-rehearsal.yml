name: Batch 11 Preview lineage rehearsal

# Manual only, and inert unless explicitly authorized at dispatch time.
#
# The remote half of this rehearsal creates a Preview database and applies a
# migration. Neither should ever happen because a branch was pushed, so there is
# no push or pull_request trigger: a human has to ask for it and type the
# authorization in.

on:
  workflow_dispatch:
    inputs:
      authorized:
        description: 'Type EXACTLY "authorize-batch-11-rehearsal" to enable the remote half. Anything else runs plan-only.'
        required: true
        default: 'plan-only'

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Always runs. Local reconciliation only; no remote operation.
      - name: Reconcile lineage (plan only)
        run: node --experimental-strip-types scripts/run-batch-11-preview-lineage-rehearsal.ts

      - name: Refuse unauthorized remote half
        if: inputs.authorized != 'authorize-batch-11-rehearsal'
        run: |
          echo "Remote rehearsal not authorized; plan-only run complete."
          echo "No Preview database was created and no migration was applied."

      # Gated twice: on the typed input here, and on the env var the script
      # itself requires. Either one missing leaves the remote half off.
      - name: Remote rehearsal
        if: inputs.authorized == 'authorize-batch-11-rehearsal'
        env:
          MAHA_B11_REHEARSAL_AUTHORIZED: '1'
          MAHA_PREVIEW_SUPABASE_URL: ${{ secrets.MAHA_PREVIEW_SUPABASE_URL }}
          MAHA_PREVIEW_SUPABASE_SERVICE_ROLE: ${{ secrets.MAHA_PREVIEW_SUPABASE_SERVICE_ROLE }}
          EPISTEMIC_RELEASE_AUTHORITY_TOKEN: ${{ secrets.EPISTEMIC_RELEASE_AUTHORITY_TOKEN }}
        run: node --experimental-strip-types scripts/run-batch-11-preview-lineage-rehearsal.ts
