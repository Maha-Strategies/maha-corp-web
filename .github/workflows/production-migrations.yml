name: Production database migrations

# Applies supabase/migrations to the Production database through a reviewed,
# evidenced path instead of the Supabase SQL editor.
#
# CORRECTED 2026-08-10: the run recorded below, and every run between
# 2026-08-03 and 2026-08-10, targeted the STAGING project. The
# SUPABASE_PROJECT_REF variable in the production-database environment held
# `wukyzcqxzkbwuledzxlx` (maha-corp-staging.) rather than the Production ref, so
# the history, pending list, drift report and convergence check in those runs
# all describe staging. Read
# docs/production-migration-evidence-2026-08-03.md with that in mind: it is
# evidence of a successful apply, but not to Production.
#
# The variable is corrected and the first step of this job now asserts the
# target against a literal in this file, so the same silent redirection cannot
# recur. Production had no migration applied through this path before
# 2026-08-10.
#
# It deliberately has no automatic revert. A down-migration against ledgers that
# hold commercial history would compound an incident rather than resolve it, so a
# failed verification leaves the applied schema in place for operator diagnosis —
# the same stance the rollback workflow takes toward deployments.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run reports pending migrations and changes nothing
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - baseline
          - apply
      reason:
        description: Change ticket or reason (minimum 12 characters)
        required: true
        type: string
      confirmation:
        description: For baseline, type RECORD PRODUCTION BASELINE; for apply, type APPLY PRODUCTION MIGRATIONS
        required: false
        type: string
      check_schema_drift:
        description: Compare the live schema against the migration tree before applying
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# Deliberately NOT the production-recovery group used by rollback. An emergency
# deployment rollback must never be queued behind a database job. Schema and
# deployment state are recovered independently.
concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-database
      url: ${{ vars.PRODUCTION_BASE_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      PRODUCTION_CANONICAL_URL: ${{ vars.PRODUCTION_BASE_URL }}
      PRODUCTION_RELEASE_HEALTH_TOKEN: ${{ secrets.PRODUCTION_RELEASE_HEALTH_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOYMENT_JSON_PATH: ${{ github.workspace }}/post-migration-deployment.json
      RELEASE_HEALTH_OUTPUT: ${{ github.workspace }}/post-migration-health.json
      EVIDENCE: ${{ github.workspace }}/migration-evidence
    steps:
      # First, before any checkout or install, because everything after this
      # step believes it is talking to Production.
      #
      # SUPABASE_PROJECT_REF held the staging ref from 2026-08-03 until
      # 2026-08-10, so every run in that window linked to staging, applied
      # migrations there, and reported staging's history, staging's pending
      # list and staging's drift as Production's. Nothing failed. The workflow
      # cannot detect this on its own: `supabase link` succeeds against any
      # project the token can reach, and every check afterwards asks the
      # database it was pointed at.
      #
      # The expected ref is a literal here rather than another variable, on
      # purpose. A variable checked against a variable proves nothing; this
      # value is in a reviewed file, under version control, and changing it
      # requires a pull request. The variable stays because it is what `link`
      # consumes, and a disagreement between the two is now a hard stop rather
      # than a silent redirection.
      - name: Assert the Production target
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          expected='uhwuullakihgszxhiygz'
          if [ -z "${REF:-}" ]; then
            echo '::error::SUPABASE_PROJECT_REF is unset. Refusing to guess which database is Production.'
            exit 1
          fi
          if [ "$REF" != "$expected" ]; then
            echo "::error::SUPABASE_PROJECT_REF is '$REF', not Production ('$expected'). Refusing to run: a migration applied to the wrong database reports success and leaves Production untouched."
            exit 1
          fi
          echo "Target confirmed: $REF"

      - name: Enforce explicit apply confirmation
        env:
          MODE: ${{ inputs.mode }}
          REASON: ${{ inputs.reason }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${#REASON}" -ge 12
          if [ "$MODE" = 'apply' ]; then
            test "$CONFIRMATION" = 'APPLY PRODUCTION MIGRATIONS'
          elif [ "$MODE" = 'baseline' ]; then
            test "$CONFIRMATION" = 'RECORD PRODUCTION BASELINE'
          fi

      - uses: actions/checkout@v7
        with:
          # Full history so the integrity check can resolve a merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: mkdir -p "$EVIDENCE"

      # The same gate the pull-request build runs. Re-run it here because the
      # dispatched ref is not necessarily the ref that was reviewed.
      - name: Verify migration integrity
        run: node --experimental-strip-types scripts/check-migrations.ts | tee "$EVIDENCE/integrity.txt"

      - name: Install pinned Supabase CLI
        run: npm install --global supabase@2.116.0

      - name: Record authorized request
        env:
          MODE: ${{ inputs.mode }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.env.EVIDENCE+'/request.json', JSON.stringify({requestedAt:new Date().toISOString(),actor:process.env.ACTOR,mode:process.env.MODE,reason:process.env.REASON,commitSha:process.env.GITHUB_SHA,workflowRunId:process.env.GITHUB_RUN_ID},null,2)+'\n',{mode:0o600})"

      # --password is read from SUPABASE_DB_PASSWORD; neither it nor the access
      # token is ever echoed.
      - name: Link the Production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" >/dev/null

      # The authoritative record of what the database believes it has applied.
      # Read this in dry-run before approving an apply.
      - name: Record migration history
        run: supabase migration list --linked 2>&1 | tee "$EVIDENCE/migration-list-before.txt"

      # Schema only — never data. A data dump would place customer records and
      # commercial history into a workflow artifact.
      - name: Capture pre-apply schema snapshot
        run: supabase db dump --linked --schema public -f "$EVIDENCE/schema-before.sql"

      # Maha OS objects predated this repository's Production migration
      # history. The reviewed 20260809000250 migration reproduces those objects
      # for clean databases, but executing it in Production would attempt to
      # create objects that already exist. This one-time mode records only that
      # exact baseline version as applied; it does not execute baseline SQL or
      # any subsequently pending migration.
      - name: Record the existing unified Maha OS baseline
        id: baseline
        if: ${{ inputs.mode == 'baseline' }}
        run: |
          set -euo pipefail
          version='20260809000250'
          file="supabase/migrations/${version}_maha_os_unified_schema_baseline.sql"
          test -f "$file"
          grep -q 'No customer data is included' "$file"
          supabase migration repair "$version" --status applied --linked 2>&1 | tee "$EVIDENCE/baseline-repair.txt"

      - name: Record migration history after baseline
        if: ${{ inputs.mode == 'baseline' }}
        run: supabase migration list --linked 2>&1 | tee "$EVIDENCE/migration-list-after-baseline.txt"

      # The failure this repository has actually experienced: schema changed
      # directly in the SQL editor, leaving the database ahead of the migration
      # tree. Applying on top of undeclared drift is how ledgers get corrupted.
      - name: Report pending migrations
        run: supabase db push --linked --dry-run 2>&1 | tee "$EVIDENCE/pending.txt"

      # Drift is recorded before applying, but only *fails* here when nothing
      # is pending to explain it.
      #
      # The original gate refused to proceed whenever live and the tree
      # disagreed, which deadlocked: a migration written to reconcile drift can
      # never be applied, because the drift it exists to remove is still present
      # when the gate runs. Unexplained drift -- live differs and no migration
      # is waiting to account for it -- is still a hard stop, because that is
      # the case the gate was built for: someone changed Production by hand.
      - name: Record schema drift before applying
        id: pre_apply_drift
        if: ${{ inputs.check_schema_drift }}
        run: |
          set -euo pipefail
          supabase db diff --linked --schema public > "$EVIDENCE/drift-before.sql"
          if [ ! -s "$EVIDENCE/drift-before.sql" ]; then
            echo 'classification=no-delta' >> "$GITHUB_OUTPUT"
            echo 'No drift: the live schema matches the migration tree.'
            exit 0
          fi
          # `db push --dry-run` prints the versions it would apply, on stderr,
          # which is why the capture above redirects it. Matching the migration
          # filename shape rather than any run of digits keeps CLI banners and
          # version strings from reading as a pending migration.
          if ! grep -qE '[0-9]{14}_[a-z0-9_]+\.sql' "$EVIDENCE/pending.txt"; then
            echo 'classification=unexplained-drift' >> "$GITHUB_OUTPUT"
            echo '::warning::The live schema differs from the migration tree and no pending migration explains the delta. See drift-before.sql.'
            cat "$EVIDENCE/drift-before.sql"
            echo '::error::Live schema differs from the migration tree and no migration is pending to reconcile it. Production was changed outside this workflow.'
            exit 1
          fi
          echo 'classification=expected-pending-delta' >> "$GITHUB_OUTPUT"
          echo '::notice::Expected schema delta from pending migrations. See drift-before.sql; convergence is verified after applying.'
          cat "$EVIDENCE/drift-before.sql"

      - name: Apply pending migrations
        id: apply
        if: ${{ inputs.mode == 'apply' }}
        run: supabase db push --linked --yes 2>&1 | tee "$EVIDENCE/applied.txt"

      - name: Record migration history after apply
        if: ${{ inputs.mode == 'apply' }}
        run: supabase migration list --linked 2>&1 | tee "$EVIDENCE/migration-list-after.txt"

      # The stop condition the pre-apply gate used to provide, moved to where it
      # can actually be satisfied. This is the stronger property: it does not
      # merely refuse to act on a disagreement, it requires the end state to
      # agree. Anything left here is a real difference the applied migrations
      # did not account for.
      - name: Verify the schema converged
        id: post_apply_drift
        if: ${{ inputs.mode == 'apply' && inputs.check_schema_drift }}
        run: |
          set -euo pipefail
          supabase db diff --linked --schema public > "$EVIDENCE/drift-after.sql"
          if [ -s "$EVIDENCE/drift-after.sql" ]; then
            echo 'classification=residual-drift' >> "$GITHUB_OUTPUT"
            echo '::error::The live schema still differs from the migration tree after applying. Compare drift-before.sql and drift-after.sql.'
            cat "$EVIDENCE/drift-after.sql"
            exit 1
          fi
          echo 'classification=converged' >> "$GITHUB_OUTPUT"
          echo 'Converged: the live schema now matches the migration tree.'

      - name: Summarize migration drift
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          CHECK_SCHEMA_DRIFT: ${{ inputs.check_schema_drift }}
        run: |
          set -euo pipefail
          pending_count=0
          if [ -f "$EVIDENCE/pending.txt" ]; then
            pending_count="$(grep -cE '[0-9]{14}_[a-z0-9_]+\.sql' "$EVIDENCE/pending.txt" || true)"
          fi

          if [ "$CHECK_SCHEMA_DRIFT" != 'true' ]; then
            pre_apply='not-checked'
          elif [ ! -e "$EVIDENCE/drift-before.sql" ]; then
            pre_apply='not-reached'
          elif [ ! -s "$EVIDENCE/drift-before.sql" ]; then
            pre_apply='no-delta'
          elif [ "$pending_count" -gt 0 ]; then
            pre_apply='expected-pending-delta'
          else
            pre_apply='unexplained-drift'
          fi

          if [ "$MODE" != 'apply' ] || [ "$CHECK_SCHEMA_DRIFT" != 'true' ]; then
            post_apply='not-run'
          elif [ ! -e "$EVIDENCE/drift-after.sql" ]; then
            post_apply='not-reached'
          elif [ -s "$EVIDENCE/drift-after.sql" ]; then
            post_apply='residual-drift'
          else
            post_apply='converged'
          fi

          if [ "$post_apply" = 'converged' ]; then
            convergence='converged'
          elif [ "$post_apply" = 'residual-drift' ]; then
            convergence='failed-residual-drift'
          elif [ "$pre_apply" = 'unexplained-drift' ]; then
            convergence='blocked-unexplained-drift'
          else
            convergence='not-applicable'
          fi

          {
            echo '## Production migration drift summary'
            echo
            echo '| Signal | Classification |'
            echo '| --- | --- |'
            echo "| Pre-apply schema comparison | $pre_apply |"
            echo "| Pending migration files | $pending_count |"
            echo "| Residual post-apply comparison | $post_apply |"
            echo "| Convergence status | $convergence |"
            echo
            echo 'A pre-apply delta explained by pending migrations is expected and is not residual drift. Only unexplained pre-apply drift emits a warning; an apply run must still finish with an empty drift-after.sql.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Schema changes are only safe once the running application still works
      # against them. This is the same readiness check the release-health and
      # rollback workflows use: homepage, OpenAPI, billing, observability.
      - name: Install pinned Vercel CLI
        if: ${{ inputs.mode == 'apply' }}
        run: npm install --global vercel@58.4.0

      - name: Resolve canonical Production deployment
        if: ${{ inputs.mode == 'apply' }}
        run: vercel inspect "$PRODUCTION_BASE_URL" --json --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_ID" > "$VERCEL_DEPLOYMENT_JSON_PATH"

      - name: Verify the application against the new schema
        if: ${{ inputs.mode == 'apply' }}
        run: node --experimental-strip-types scripts/verify-production-release.ts | tee "$EVIDENCE/post-apply-health.txt"

      # Only meaningful once the push step actually started. A failure before
      # that point changed nothing, and saying otherwise would send an operator
      # looking for damage that does not exist.
      - name: Warn that the schema was not reverted
        if: ${{ failure() && steps.apply.outcome != 'skipped' }}
        run: |
          echo '::error::Migrations were applied or partially applied, and a later step failed. The schema has NOT been reverted; reverting a ledger migration automatically would compound the incident. Diagnose using the uploaded evidence and the preserved pre-apply schema snapshot.'
          exit 1

      - name: Warn that baseline history was not reverted
        if: ${{ failure() && steps.baseline.outcome == 'success' }}
        run: |
          echo '::error::The Maha OS baseline version was recorded as applied, but a later verification step failed. No schema SQL was executed. Diagnose using the uploaded before/after migration history before changing that record.'
          exit 1

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-migrations-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE }}
            ${{ env.RELEASE_HEALTH_OUTPUT }}
            ${{ env.VERCEL_DEPLOYMENT_JSON_PATH }}
          if-no-files-found: warn
          retention-days: 90
